[package]
name = "bulletmd-native-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
gpui = "0.2.2"
notify = "8"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
strip = true
